syntax = "proto3";

package hflabs.accelerator.v1;

option csharp_namespace = "HFLabs.Accelerator.Grpc";

// Accelerator heterogeneous orchestration and compute service
service AcceleratorPlanService {
  // Dispatches a declarative execution plan DAG to candidate devices
  rpc ExecutePlan (PlanEnvelope) returns (PlanExecutionResult);
  
  // Queries active device telemetry, tile memory status, and scoring
  rpc GetDeviceInventory (DeviceInventoryRequest) returns (DeviceInventoryResponse);
  
  // Streaming execution telemetry sidecar
  rpc StreamExecutionMetrics (MetricsSubscriptionRequest) returns (stream TelemetryMetricFrame);
}

message PlanEnvelope {
  string plan_id = 1;
  string plan_hash_sha256 = 2;
  int32 priority = 3;
  ExecutionModel execution_model = 4;
  repeated TensorDescriptor input_tensors = 5;
  repeated ComputeNode nodes = 6;
  map<string, string> metadata = 7;
}

enum ExecutionModel {
  EXECUTION_MODEL_UNSPECIFIED = 0;
  EXECUTION_MODEL_SPMD = 1;      // Intel Level Zero GPU / CPU SIMD
  EXECUTION_MODEL_BSP = 2;       // Graphcore Poplar IPU Supersteps
  EXECUTION_MODEL_HYBRID = 3;    // Multi-substrate coordinated pipeline
}

message ComputeNode {
  string node_id = 1;
  string kernel_name = 2;
  string target_backend = 3;     // "LevelZero", "Poplar", "CUDA", "HostSIMD"
  repeated string dependency_node_ids = 4;
  bytes kernel_binary_override = 5;
}

message TensorDescriptor {
  string tensor_name = 1;
  repeated int64 shape = 2;
  string dtype = 3;             // "FP32", "FP16", "BF16", "INT8"
  int64 byte_size = 4;
}

message PlanExecutionResult {
  string plan_id = 1;
  bool success = 2;
  double execution_time_us = 3;
  double marshaling_time_us = 4;
  string target_device_used = 5;
  repeated TensorDescriptor output_tensors = 6;
  string error_message = 7;
}

message DeviceInventoryRequest {}

message DeviceInventoryResponse {
  repeated DeviceDescriptor devices = 1;
}

message DeviceDescriptor {
  int32 device_id = 1;
  string device_name = 2;
  string vendor = 3;            // "Intel", "Graphcore", "NVIDIA", "Host"
  int64 total_memory_bytes = 4;
  int64 available_memory_bytes = 5;
  double compute_score = 6;
}

message MetricsSubscriptionRequest {
  string plan_id = 1;
}

message TelemetryMetricFrame {
  int64 timestamp_ns = 1;
  string node_id = 2;
  double vram_utilization_pct = 3;
  double compute_utilization_pct = 4;
  double power_watts = 5;
}
